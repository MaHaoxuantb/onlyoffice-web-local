server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # These large runtime files keep stable paths, so use a bounded cache that
    # improves repeat launches without leaving old deployments stuck for long.
    location ~ ^/(wasm|sdkjs|web-apps|fonts)/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
