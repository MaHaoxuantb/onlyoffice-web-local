server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ONLYOFFICE runtime files are version-coupled but keep stable URLs. Always
    # revalidate them so a deployment cannot mix incompatible cached versions.
    location ~ ^/(wasm|sdkjs|web-apps|fonts)/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
