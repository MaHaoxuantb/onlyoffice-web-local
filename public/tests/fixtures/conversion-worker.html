<!doctype html><meta charset="utf-8"><title>Office worker verification</title>
<style>body{font:16px system-ui;padding:32px;background:#17191b;color:#eee}button,input{font:inherit;padding:10px;margin:10px}pre{white-space:pre-wrap}.box{width:60px;height:60px;background:#68a9ec;animation:pan 1s linear infinite alternate}@keyframes pan{to{transform:translateX(300px)}}
</style><h1>Office worker verification</h1><p>Local synthetic DOCX; no LFOS account or provider connection.</p><div class="box"></div><input aria-label="Typing during conversion"><button id="run">Convert DOCX → BIN → DOCX</button><button id="download" disabled>Download converted fixture</button><pre id="result">Ready.</pre>
<script>
const path=new URL(location.href).searchParams.get('worker');const worker=new Worker(path);let id=0;const pending=new Map();let converted;
worker.onmessage=({data})=>{const p=pending.get(data.requestId);if(!p)return;pending.delete(data.requestId);data.ok?p.resolve(data.result):p.reject(new Error(data.error));};worker.onerror=e=>document.querySelector('#result').textContent=e.message;
const request=(method,args=[])=>new Promise((resolve,reject)=>{const requestId=++id;pending.set(requestId,{resolve,reject});worker.postMessage({requestId,method,args});});
let frames=[],previous=performance.now(),active=false,longTasks=[];function frame(now){if(active)frames.push(now-previous);previous=now;requestAnimationFrame(frame);}requestAnimationFrame(frame);
try{new PerformanceObserver(list=>{if(active)longTasks.push(...list.getEntries().map(x=>x.duration));}).observe({type:'longtask',buffered:false});}catch{}
document.querySelector('#run').onclick=async()=>{try{active=true;document.querySelector('#result').textContent='Converting in the worker…';await request('initialize');const bytes=await(await fetch('/tests/fixtures/thread-document.docx')).arrayBuffer();const opened=await request('open',[new File([bytes],'thread-document.docx')]);converted=await request('save',[opened.bin,opened.fileName,'DOCX']);active=false;frames.sort((a,b)=>a-b);document.querySelector('#result').textContent=JSON.stringify({openedType:opened.type,binBytes:opened.bin.length,docxBytes:converted.data.length,zipSignature:Array.from(converted.data.slice(0,2)),frameP95Ms:frames[Math.floor(frames.length*.95)],longTasksMs:longTasks},null,2);document.querySelector('#download').disabled=false;}catch(error){active=false;document.querySelector('#result').textContent=error.stack;}};
document.querySelector('#download').onclick=()=>{const url=URL.createObjectURL(new Blob([converted.data]));const a=document.createElement('a');a.href=url;a.download='thread-converted.docx';a.click();URL.revokeObjectURL(url);};
</script>
